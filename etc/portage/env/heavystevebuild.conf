# by F.C.

# Some 'large' packages need to be treated specially (e.g.
# www-client/chromium might require limiting the parallel
# jobs). See also /etc/portage/make.conf/00-makeopts.conf
#
# USE THIS OVERRIDE ONLY WITH THE STEVE JOB SERVER
# ENABLED. See https://wiki.gentoo.org/wiki/Steve.

# Fallback for non-jobserver-aware builds.
MAKEOPTS="-j5"

# Jobserver-aware builds.
pre_src_compile() {
    _STEVE_BACKUP_JOBS=$(stevie --get-jobs) || return 1
    _STEVE_BACKUP_MEM_LIMIT=$(stevie --get-min-memory-avail) || return 1
    _STEVE_BACKUP_ACTIVE=1

    stevie --set-jobs 5 || return 1
    stevie --set-min-memory-avail 8192 || return 1
}

# Restore the original settings.
restore_jobsserver_settings() {
    # Nothing to restore if src_compile has not started.
    [[ ${_STEVE_BACKUP_ACTIVE:-0} == 1 ]] || return 0

    stevie --set-min-memory-avail "${_STEVE_BACKUP_MEM_LIMIT}" || return 1
    stevie --set-jobs "${_STEVE_BACKUP_JOBS}" || return 1
    _STEVE_BACKUP_ACTIVE=0
}

# Restore original settings after successful compilation.
post_src_compile() {
    restore_jobsserver_settings
}

# Restore original settings in case the ebuild fails.
register_die_hook restore_jobsserver_settings
