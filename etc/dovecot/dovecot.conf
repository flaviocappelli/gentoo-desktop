# by F.C.
# ---------------- Expose mbox /var/spool/mail/<user> through POP3S ----------------
# See
#  - https://doc.dovecot.org/2.4.4/core/config/mailbox_formats/mbox.html
#  - https://doc.dovecot.org/2.4.4/core/config/mail_location.html#index-files
#  - https://doc.dovecot.org/2.4.4/core/config/pop3.html
#
# This instance is intentionally configured as a minimal POP3-over-TLS frontend
# for the local Unix mailbox (/var/spool/mail). Mail delivery is handled separately
# by OpenSMTPD. Dovecot only provides authenticated POP3S access to /var/spool/mail:
#
#
#          local services (cron, mdadm, smartd, zed, ...)
#                              |
#                              | SMTP
#                              v
#                      +----------------+
#                      |   OpenSMTPD    |           MTA
#                      |  localhost:25  |  (Mail Transport Agent)
#                      +----------------+
#                              |
#                              | local delivery
#                              v
#                    /var/spool/mail/<user>
#                              |
#                              | mbox file read
#                              v
#                      +----------------+
#                      |    Dovecot     |        MAIL SERVER
#                      |   POP3S (995)  |
#                      +----------------+
#                             |
#                             | POP3 over TLS (prevent exposing the
#                             | user login password in plain text)
#                             v
#                     Mozilla Thunderbird
#
#
# Since Thunderbird cannot monitor local system mbox anymore (such as those
# in /var/spool/mail), using a minimal mail server is the most efficient way
# to deliver system alerts to the email client. This represents the simplest
# setup. If we need to support multiple administrators, we have two options:
#
#   1. Forward system emails to each administrator by listing them
#      in /etc/mail/aliases (root: user1, user2, ...). In this case,
#      each user maintains its own mailbox and configures Thunderbird
#      (or any POP3S-compatible client) to fetch the incoming alerts.
#
#   2. Create a shared folder in Dovecot, accessible via IMAP and ACLs.
#      This approach allows users to create shared subfolders to organize
#      emails, for instance, to indicate which alerts are currently being
#      processed. Naturally, this second configuration is more complex.
#
# NOTE
# The bundled "dovecot.socket" unit MUST NOT BE USED for this configuration.
# It only provides activation for IMAP/IMAPS listeners (ports 143 and 993)
# and does not include POP3/POP3S listeners (ports 110 and 995). Since this
# instance exposes only POP3S, "dovecot.service" must be started directly
# (and socket activation must be disabled if enabled by default).


# Listen for email clients only on localhost
# (no protocols are exposed to the network).
listen = 127.0.0.1

# Use POP3/POP3S instead of IMAP.
protocols {
  pop3 = yes
}
pop3_no_flag_updates = yes

# Disable insecure POP3 without TLS (i.e. port 110).
service pop3-login {
    inet_listener pop3 {
        port = 0
    }
}

# Keep the traditional Unix mbox spool (Dovecot
# reads the existing mailbox created by OpenSMTPD).
mail_driver = mbox
mail_inbox_path = /var/spool/mail/%{user}

# No persistent mail storage or indexes are needed (the mailbox is
# a simple local system spool and POP3 is used only for retrieval).
mail_home = /var/empty
mail_path = /var/empty
mail_index_path = MEMORY

# Allow Dovecot to temporarily access the mail group for mbox locking.
mail_privileged_group = mail

# Authenticate users through the system authentication stack
# (this keeps Dovecot credentials aligned with system accounts).
passdb pam {
}
userdb passwd {
}

# TLS configuration.
ssl_server {
  cert_file = /etc/dovecot/server.pem
  key_file = /etc/dovecot/server.key
}
